[package]
name = "nvim-gfx"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "nvim-gfx"
path = "src/main.rs"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
winit = "0.30"
softbuffer = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
x11rb = { version = "0.13", features = ["allow-unsafe-code"] }
libc = "0.2"
