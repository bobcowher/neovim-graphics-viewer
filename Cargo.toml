[package]
name = "nvim-gfx"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "nvim-gfx"
path = "src/main.rs"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ffmpeg-next = "6"
base64 = "0.22"
